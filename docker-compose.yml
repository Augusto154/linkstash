services:
  postgres:
    image: postgres:17-alpine
    container_name: linkstash-postgres
    environment:
      POSTGRES_USER: linkstash
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linkstash_dev_change_me}
      POSTGRES_DB: linkstash
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkstash -d linkstash"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [linkstash]

  backend:
    build: ./backend
    container_name: linkstash-backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://linkstash:${POSTGRES_PASSWORD:-linkstash_dev_change_me}@postgres:5432/linkstash
      JWT_SECRET: ${JWT_SECRET:-change-this-secret}
      API_PORT: 5000
    ports: ["5000:5000"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [linkstash]

  frontend:
    build: ./frontend
    container_name: linkstash-frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    ports: ["3000:4173"]
    depends_on: [backend]
    networks: [linkstash]

volumes:
  postgres_data:
networks:
  linkstash:
