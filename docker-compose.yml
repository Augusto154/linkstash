services:
  postgres:
    image: postgres:17-alpine
    container_name: linkstash-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: linkstash
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: linkstash
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkstash -d linkstash"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [linkstash]

  backend:
    build: ./backend
    container_name: linkstash-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://linkstash:${POSTGRES_PASSWORD}@postgres:5432/linkstash
      JWT_SECRET: ${JWT_SECRET}
      API_PORT: 5000
      FRONTEND_URL: ${FRONTEND_URL}
    expose: ["5000"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [linkstash]

  frontend:
    build: ./frontend
    container_name: linkstash-frontend
    restart: unless-stopped
    expose: ["80"]
    depends_on: [backend]
    networks: [linkstash]

  caddy:
    image: caddy:2-alpine
    container_name: linkstash-caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend]
    networks: [linkstash]

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  linkstash:
